<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>测测你命中注定是哪里的留子(嘴毒版)</title>
  <style>
    /* ============================================
       CSS Variables & Reset
    ============================================ */
    :root {
      --color-yellow: #FFF000;
      --color-magenta: #FF00FF;
      --color-cyan: #00FFFF;
      --color-black: #000000;
      --color-white: #FFFFFF;
      --border-width: 4px;
      --shadow-offset: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background-color: var(--color-cyan);
      background-image: radial-gradient(var(--color-black) 15%, transparent 16%);
      background-size: 25px 25px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* ============================================
       Container
    ============================================ */
    .container {
      width: 100%;
      max-width: 480px;
      background: var(--color-white);
      border: var(--border-width) solid var(--color-black);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--color-yellow);
      padding: 30px 20px;
      margin-top: 0;
    }

    /* ============================================
       Cover Page
    ============================================ */
    .cover-page {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 62vh;
      padding: 20px 0;
    }

    .cover-title {
      font-size: 48px;
      font-weight: 900;
      color: var(--color-black);
      line-height: 1.2;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .cover-subtitle {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-black);
      margin-bottom: 40px;
    }

    .btn {
      display: inline-block;
      padding: 16px 40px;
      font-size: 20px;
      font-weight: 900;
      color: var(--color-black);
      background: var(--color-yellow);
      border: var(--border-width) solid var(--color-black);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--color-magenta);
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 6px 6px 0px var(--color-magenta);
    }

    .btn:active {
      transform: translate(4px, 4px);
      box-shadow: 4px 4px 0px var(--color-magenta);
    }

    /* ============================================
       Quiz Page
    ============================================ */
    .quiz-page {
      display: none;
    }

    .quiz-page.active {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 62vh;
    }

    .progress {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 30px;
      color: var(--color-black);
    }

    .question {
      font-size: 24px;
      font-weight: 900;
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.4;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    .option {
      display: block;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 700;
      color: var(--color-black);
      background: var(--color-white);
      border: var(--border-width) solid var(--color-black);
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }

    .option:hover {
      background: var(--color-cyan);
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0px var(--color-black);
    }

    .option.selected {
      background: var(--color-magenta);
      color: var(--color-white);
      transform: translate(2px, 2px);
      box-shadow: 4px 4px 0px var(--color-black);
    }

    .quiz-actions {
      display: flex;
      justify-content: flex-end;
    }

    @media (max-height: 680px) {
      .cover-page {
        min-height: auto;
      }

      .quiz-page.active {
        min-height: auto;
      }

      .result-page.active {
        min-height: auto;
      }
    }

    .btn-prev {
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 700;
      background: #f4f4f4;
      border-width: 2px;
      box-shadow: none;
      color: #333333;
      transition: background-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
    }

    .btn-prev:hover {
      background: #ebebeb;
      color: #111111;
      transform: none;
      box-shadow: none;
    }

    .btn-prev:active {
      background: #dfdfdf;
      transform: none;
      box-shadow: none;
    }

    .btn-prev:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ============================================
       Result Page
    ============================================ */
    .result-page {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .result-page.active {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 62vh;
    }

    .result-emoji {
      font-size: 72px;
      margin-bottom: 20px;
    }

    .result-title {
      font-size: 36px;
      font-weight: 900;
      margin-bottom: 30px;
      color: var(--color-black);
    }

    .result-body {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.8;
      white-space: pre-line;
      margin-bottom: 40px;
      text-align: left;
      padding: 20px;
      background: var(--color-yellow);
      border: var(--border-width) solid var(--color-black);
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn-secondary {
      background: var(--color-cyan);
    }

    .btn-easter-egg {
      background: var(--color-magenta);
      color: var(--color-white);
    }

    /* ============================================
       Animations
    ============================================ */
    .slide-out {
      animation: slideOut 0.3s ease forwards;
    }

    .slide-in {
      animation: slideIn 0.3s ease forwards;
    }

    @keyframes slideOut {
      from {
        transform: translateX(0);
        opacity: 1;
      }
      to {
        transform: translateX(-100%);
        opacity: 0;
      }
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* ============================================
       Utility
    ============================================ */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Cover Page -->
    <div id="cover" class="cover-page">
      <h1 class="cover-title">测测你命中注定是哪里的留子</h1>
      <p class="cover-subtitle">嘴毒, 玻璃心别测</p>
      <button class="btn" onclick="startQuiz()">开始测试</button>
    </div>

    <!-- Quiz Page -->
    <div id="quiz" class="quiz-page">
      <h2 class="cover-subtitle">你命中注定是哪里的留子</h2>
      <div class="progress" id="progress">1 / 5</div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="quiz-actions">
        <button id="prev-btn" class="btn btn-prev" type="button" onclick="goToPreviousQuestion()">上一题</button>
      </div>
    </div>

    <!-- Result Page -->
    <div id="result" class="result-page">
      <div class="result-emoji" id="result-emoji"></div>
      <h2 class="result-title" id="result-title"></h2>
      <div class="result-body" id="result-body"></div>
      <div class="result-actions">
        <button class="btn btn-secondary" onclick="restartQuiz()">再测一次</button>
        <button class="btn" onclick="shareResult()">分享结果</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // QUIZ CONFIG - Modify this object to change content
    // ============================================
    const QUIZ_CONFIG = {
      // Questions and Options
      questions: [
        {
          id: 'Q1',
          text: '你怎么看白人饭🥙?',
          options: [
            { id: 'A', text: '生命体征维持餐,活着就行', scores: { US:0, UK:0, AU:3, HK:0, EU:3, CN:0 } },
            { id: 'B', text: '忍一段时间也行',        scores: { US:2, UK:2, AU:0, HK:0, EU:0, CN:0 } },
            { id: 'C', text: '不行,我要米其林外卖',       scores: { US:0, UK:0, AU:0, HK:3, EU:0, CN:0 } },
            { id: 'D', text: '我直接回国猛吃',             scores: { US:0, UK:0, AU:0, HK:0, EU:0, CN:3 } },
          ],
        },
        {
          id: 'Q2',
          text: '害怕受到歧视吗？',
          options: [
            { id: 'A', text: '怕,晚上被窝里掉小珍珠🥲',   scores: { US:3, UK:0, AU:0, HK:0, EU:0, CN:0 } },
            { id: 'B', text: '怕,但是能躲🏃‍♀️‍➡️',          scores: { US:2, UK:1, AU:0, HK:0, EU:0, CN:0 } },
            { id: 'C', text: '不怕,不服就干👊',          scores: { US:0, UK:1, AU:1, HK:1, EU:1, CN:0 } },
            { id: 'D', text: '我选择中国人抱团',      scores: { US:0, UK:0, AU:3, HK:0, EU:0, CN:2 } },
          ],
        },
        {
          id: 'Q3',
          text: '家里知道你要花多少钱💰吗？',
          options: [
            { id: 'A', text: '知道,不过家里不缺钱😎',  scores: { US:2, UK:2, AU:2, HK:0, EU:0, CN:0 } },
            { id: 'B', text: '知道,他们说全家托举👐',    scores: { US:0, UK:1, AU:0, HK:2, EU:0, CN:1 } },
            { id: 'C', text: '不知道,我没敢说🫢',      scores: { US:0, UK:0, AU:0, HK:0, EU:3, CN:0 } },
            { id: 'D', text: '自己挣的💪',    scores: { US:0, UK:0, AU:0, HK:0, EU:0, CN:3 } },
          ],
        },
        {
          id: 'Q4',
          text: '出去是为了什么？',
          easterEggOption: 'C',
          options: [
            { id: 'A', text: '镀金,回来好找工作',  scores: { US:0, UK:3, AU:0, HK:3, EU:0, CN:0 } },
            { id: 'B', text: '真的想留在那边',  scores: { US:3, UK:0, AU:2, HK:0, EU:0, CN:0 } },
            { id: 'C', text: '逃，国内太卷了',      scores: { US:0, UK:0, AU:0, HK:0, EU:0, CN:0 } },
            { id: 'D', text: '我也不知道',      scores: { US:0, UK:0, AU:3, HK:0, EU:0, CN:2 } },
          ],
        },
        {
          id: 'Q5',
          text: '村里发金条了，你怎么办',
          options: [
            { id: 'A', text: '不管,金条留给我弟',      scores: { US:2, UK:2, AU:2, HK:2, EU:2, CN:0 } },
            { id: 'B', text: '先看金条成色',      scores: { US:0, UK:0, AU:0, HK:3, EU:0, CN:1 } },
            { id: 'C', text: '连夜赶回',    scores: { US:0, UK:0, AU:0, HK:0, EU:0, CN:3 } },
            { id: 'D', text: '什么金条,我没收到',    scores: { US:2, UK:0, AU:0, HK:0, EU:2, CN:0 } },
          ],
        },
      ],

      // Result Content
      results: {
        US: {
          emoji: '🇺🇸',
          title: '美国',
          body: `恭喜你, 美国梦\nH1B抽签25%\n归来月薪8K\n永远回不了本\n\n但你还是会去的, 对吧`,
        },
        UK: {
          emoji: '🇬🇧',
          title: '英国',
          body: `一年硕\n自己累了\n别人笑了\n\n学校放简历第一行\n祈祷没人问第二行`,
        },
        AU: {
          emoji: '🇦🇺',
          title: '澳洲',
          body: `发配成功\n开始求生\n\n天很蓝\n草很绿\n中国人很多\n简历很安静`,
        },
        HK: {
          emoji: '🇭🇰🇲🇴🇸🇬',
          title: '港澳新',
          body: `出国了\n\n算出国了\n真的出国了吗\n\n竞争比国内小亿点点\n大概`,
        },
        EU: {
          emoji: '🇪🇺',
          title: '欧陆',
          body: `吃草第一关\n语言第二关\n找工第三关\n\n闯过去了是真勇士\n闯不过去也没人知道你去过`,
        },
        CN: {
          emoji: '🇨🇳',
          title: '回国',
          body: `村里发金条了\n享受廉价劳动力了\n\n没说你🤭\n说的是快递和外卖\n还有小费不用给了呢`,
        },
        EASTER_EGG: {
          emoji: '🥚',
          title: '彩蛋',
          body: `恭喜你发现彩蛋\n\n逃避可耻但是有用\n——你的目的地是任何一个不是家的地方\n\n谁不是呢`,
        },
      },
    };

    // ============================================
    // Quiz State
    // ============================================
    let currentQuestionIndex = 0;
    let userAnswers = [];

    // ============================================
    // DOM Elements
    // ============================================
    const coverPage = document.getElementById('cover');
    const quizPage = document.getElementById('quiz');
    const resultPage = document.getElementById('result');
    const progressEl = document.getElementById('progress');
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const prevBtn = document.getElementById('prev-btn');
    const resultEmojiEl = document.getElementById('result-emoji');
    const resultTitleEl = document.getElementById('result-title');
    const resultBodyEl = document.getElementById('result-body');

    // ============================================
    // Functions
    // ============================================
    function startQuiz() {
      coverPage.classList.add('slide-out');
      setTimeout(() => {
        coverPage.classList.add('hidden');
        coverPage.classList.remove('slide-out');
        quizPage.classList.remove('hidden');
        quizPage.classList.add('active', 'slide-in');
        renderQuestion();
      }, 300);
    }

    function renderQuestion() {
      const question = QUIZ_CONFIG.questions[currentQuestionIndex];
      progressEl.textContent = `${currentQuestionIndex + 1} / ${QUIZ_CONFIG.questions.length}`;
      questionEl.textContent = question.text;
      prevBtn.disabled = currentQuestionIndex === 0;
      prevBtn.classList.toggle('hidden', currentQuestionIndex === 0);

      optionsEl.innerHTML = '';
      const currentAnswer = userAnswers[currentQuestionIndex];
      question.options.forEach((option, index) => {
        const optionEl = document.createElement('label');
        optionEl.className = 'option';
        if (currentAnswer && currentAnswer.optionId === option.id) {
          optionEl.classList.add('selected');
        }
        optionEl.textContent = option.text;
        optionEl.onclick = () => selectOption(option);
        optionsEl.appendChild(optionEl);
      });
    }

    function selectOption(option) {
      const question = QUIZ_CONFIG.questions[currentQuestionIndex];
      userAnswers[currentQuestionIndex] = {
        questionId: question.id,
        optionId: option.id,
        scores: option.scores,
      };

      // Check for easter egg
      if (question.easterEggOption && option.id === question.easterEggOption) {
        showResult('EASTER_EGG');
        return;
      }

      // Move to next question or show result
      if (currentQuestionIndex < QUIZ_CONFIG.questions.length - 1) {
        // Animate out
        quizPage.classList.add('slide-out');
        setTimeout(() => {
          quizPage.classList.remove('slide-out');
          currentQuestionIndex++;
          renderQuestion();
          quizPage.classList.add('slide-in');
          setTimeout(() => quizPage.classList.remove('slide-in'), 300);
        }, 300);
      } else {
        showResult(calculateResult());
      }
    }

    function goToPreviousQuestion() {
      if (currentQuestionIndex === 0) return;

      quizPage.classList.add('slide-out');
      setTimeout(() => {
        quizPage.classList.remove('slide-out');
        currentQuestionIndex--;
        renderQuestion();
        quizPage.classList.add('slide-in');
        setTimeout(() => quizPage.classList.remove('slide-in'), 300);
      }, 300);
    }

    function calculateResult() {
      const totals = { US: 0, UK: 0, AU: 0, HK: 0, EU: 0, CN: 0 };

      userAnswers.forEach(answer => {
        Object.keys(totals).forEach(dest => {
          totals[dest] += answer.scores[dest] || 0;
        });
      });

      // Find destination with highest score
      let maxScore = -1;
      let result = 'US';
      Object.keys(totals).forEach(dest => {
        if (totals[dest] > maxScore) {
          maxScore = totals[dest];
          result = dest;
        }
      });

      return result;
    }

    function showResult(resultKey) {
      const result = QUIZ_CONFIG.results[resultKey];

      quizPage.classList.add('slide-out');
      setTimeout(() => {
        quizPage.classList.add('hidden', 'slide-out');
        resultPage.classList.remove('hidden');
        resultEmojiEl.textContent = result.emoji;
        resultTitleEl.textContent = result.title;
        resultBodyEl.textContent = result.body;
        resultPage.classList.add('active', 'slide-in');
      }, 300);
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      userAnswers = [];
      resultPage.classList.add('slide-out');
      setTimeout(() => {
        // 清理 resultPage 状态
        resultPage.classList.remove('slide-out');
        resultPage.classList.add('hidden');
        resultPage.classList.remove('active');

        // 确保 quizPage 保持隐藏状态
        quizPage.classList.add('hidden');
        quizPage.classList.remove('slide-out');

        // 显示 coverPage
        coverPage.classList.remove('hidden');
        coverPage.classList.add('slide-in');
        setTimeout(() => coverPage.classList.remove('slide-in'), 300);
      }, 300);
    }

    async function shareResult() {
      const resultTitle = resultTitleEl.textContent;
      const resultBody = resultBodyEl.textContent;
      const shareText = `我的留学目的地是${resultTitle}！\n\n${resultBody}\n\n测试地址：`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: '测测你命中注定是哪里的留子',
            text: shareText,
          });
        } catch (err) {
          if (err.name !== 'AbortError') {
            promptShare(shareText);
          }
        }
      } else {
        promptShare(shareText);
      }
    }

    function promptShare(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      alert('结果已复制到剪贴板，截图分享吧！');
    }
  </script>
</body>
</html>
